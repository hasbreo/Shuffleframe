plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hasbreo.shuffleframe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hasbreo.shuffleframe'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '0.7.0'
    }

    // Use the SAME persisted keystore on every CI run. Android Gradle's default
    // is XDG_CONFIG_HOME/.android on GitHub runners, which was not the cached path.
    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
