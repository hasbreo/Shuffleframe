plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hasbreo.shuffleframe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hasbreo.shuffleframe'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
