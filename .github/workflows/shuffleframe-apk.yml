name: Shuffleframe APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/shuffleframe-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shuffleframe-releases
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER" || { echo "Android SDK command line tools missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keep debug signature consistent for future testing updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shuffleframe-debug-signing-key-v2
      - name: Require the exact pinned v0.7 signing key from Actions cache
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore" || { echo "::error::Signing key cache missing. Refusing to create another random key."; exit 1; }
          KEY_SHA=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "Pinned key SHA-256: $KEY_SHA"
          test "$KEY_SHA" = "939dd42cebe0219bfc3dc4a851fc862d7a339245a317bcdd7cf591d9caea0e8e" || { echo "::error::Signing key changed. Refusing to build a non-updatable APK."; exit 1; }
      - name: Diagnose restored signing key and Gradle signing path
        run: |
          echo "Cached keystore identity:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|Owner:' || true
          echo "Gradle configured signing identity:"
          gradle --no-daemon :app:signingReport | grep -E 'Variant:|Config:|Store:|SHA-256:' || true
      - name: Compile installable APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Shuffleframe.apk
      - name: Verify APK matches pinned stable signing certificate
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGN_SHA=$("$SIGNER" verify --print-certs Shuffleframe.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          PACKAGE=$("$AAPT" dump badging Shuffleframe.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VERSION=$("$AAPT" dump badging Shuffleframe.apk | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" | head -n1)
          echo "Signed APK certificate SHA-256: $SIGN_SHA"
          echo "Package: $PACKAGE versionCode=$VERSION"
          test "$SIGN_SHA" = "939dd42cebe0219bfc3dc4a851fc862d7a339245a317bcdd7cf591d9caea0e8e" || { echo "::error::APK signature is not the pinned v0.7 key."; exit 1; }
          test "$PACKAGE" = 'com.hasbreo.shuffleframe' || { echo "::error::Package identity changed"; exit 1; }
          test "$VERSION" = 7 || { echo "::error::Version code must be 7"; exit 1; }
      - name: Restore authentic v0.6 release from immutable historical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/shuffleframe-original-v06
          gh run download 41383507788 --repo "$GITHUB_REPOSITORY" --name Shuffleframe-APK --dir /tmp/shuffleframe-original-v06
          OLD_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/shuffleframe-original-v06/Shuffleframe.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$OLD_SHA" = '75d72de39becbd463cefdd02b726d1dfe69dc61b3bd7402aa9d6074b7b422985' || { echo "::error::Original v0.6 artifact changed"; exit 1; }
          gh release upload v0.6.0 /tmp/shuffleframe-original-v06/Shuffleframe.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Shuffleframe-APK
          path: Shuffleframe.apk
          if-no-files-found: error
      - name: Publish phone-downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.0 >/dev/null 2>&1; then
            gh release upload v0.7.0 Shuffleframe.apk --clobber
          else
            gh release create v0.7.0 Shuffleframe.apk --title "Shuffleframe v0.7.0 (testing)" --notes "Fix video CDN downloads and add video diagnostics, retry and app version. IMPORTANT: v0.6 used a lost ephemeral signing key. Back up cache with migration scripts before uninstalling v0.6. v0.7 uses a pinned key for future updates." --prerelease
          fi
