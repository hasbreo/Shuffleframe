name: Shuffleframe APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/shuffleframe-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER" || { echo "Android SDK command line tools missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keep debug signature consistent for future testing updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shuffleframe-debug-signing-key-v2
      - name: Create persistent debug signing key if needed
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
      - name: Compile installable APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Shuffleframe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shuffleframe-APK
          path: Shuffleframe.apk
          if-no-files-found: error
      - name: Publish phone-downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 Shuffleframe.apk --clobber
          else
            gh release create v0.5.0 Shuffleframe.apk --title "Shuffleframe v0.5.0 (testing)" --notes "Full offline video downloads with resume, video autoplay and seeking, no fixed six-download cap, slideshow interval setting, fixed repeatable shuffle order, clean player controls. Experimental shared-album importer." --prerelease
          fi
