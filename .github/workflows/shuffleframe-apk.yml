name: Shuffleframe APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', '.github/workflows/shuffleframe-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Shuffleframe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
