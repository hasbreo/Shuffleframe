name: Shuffleframe APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/shuffleframe-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shuffleframe-releases
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER" || { echo "Android SDK command line tools missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keep debug signature consistent for future testing updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shuffleframe-debug-signing-key-v2
      - name: Create persistent debug signing key if needed
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
      - name: Compile installable APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Shuffleframe.apk
      - name: Verify same signing certificate and package as installed v0.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/shuffleframe-v06
          # This original v0.6.0 artifact is immutable. The old release asset was
          # subsequently overwritten by older in-flight workflows.
          gh run download 41383507788 --repo "$GITHUB_REPOSITORY" --name Shuffleframe-APK --dir /tmp/shuffleframe-v06
          OLD=/tmp/shuffleframe-v06/Shuffleframe.apk
          NEW=Shuffleframe.apk
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          OLD_SHA=$("$SIGNER" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          NEW_SHA=$("$SIGNER" verify --print-certs "$NEW" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test -n "$OLD_SHA"
          test -n "$NEW_SHA"
          echo "Installed v0.6 signing fingerprint: $OLD_SHA"
          echo "New v0.7 signing fingerprint:       $NEW_SHA"
          test "$OLD_SHA" = "$NEW_SHA" || { echo "::error::Signing key differs from v0.6. APK not published."; exit 1; }
          OLD_PACKAGE=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          NEW_PACKAGE=$("$AAPT" dump badging "$NEW" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          NEW_CODE=$("$AAPT" dump badging "$NEW" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" | head -n1)
          echo "Package ID: $NEW_PACKAGE; new versionCode: $NEW_CODE"
          test "$OLD_PACKAGE" = 'com.hasbreo.shuffleframe'
          test "$NEW_PACKAGE" = "$OLD_PACKAGE" || { echo "::error::Package ID changed"; exit 1; }
          test "$NEW_CODE" = 7 || { echo "::error::Incorrect update version"; exit 1; }
          echo "Verified: v0.7 uses v0.6 signing cert and package ID."
      - name: Restore authentic v0.6 release APK from original build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.6.0 /tmp/shuffleframe-v06/Shuffleframe.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Shuffleframe-APK
          path: Shuffleframe.apk
          if-no-files-found: error
      - name: Publish phone-downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.0 >/dev/null 2>&1; then
            gh release upload v0.7.0 Shuffleframe.apk --clobber
          else
            gh release create v0.7.0 Shuffleframe.apk --title "Shuffleframe v0.7.0 (testing)" --notes "Fix Google Photos video-download redirects, separately display video counts and failures, Retry missing videos, show app version. Verified same signing certificate and package as v0.6 to preserve cache." --prerelease
          fi
